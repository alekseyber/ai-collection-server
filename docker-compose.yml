  redis:
    image: redis:8.8.3-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /home/berestov/projects/ai-collection-server/redis/data:/data
    networks:
      - proxy
    restart: unless-stopped
    command: redis-server --appendonly yes
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    env_file:
      - ./.env.pg
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /home/berestov/projects/ai-collection-server/pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - proxy  
  nodejs:
    user: "1000:1000"
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      - redis
    env_file:
     - ./.env.nodejs
     - ./.env.pg
    container_name: nodejs
    volumes:
      # Монтируем только необходимые файлы для разработки
      - /home/berestov/projects/ai-collection-server/app/src:/usr/src/app/src
      # логи прогонов стиль-модели (режим /style): без тома теряются при пересборке
      - /home/berestov/projects/ai-collection-server/logs:/usr/src/app/logs
      - /home/berestov/projects/ai-collection-server/app/package.json:/usr/src/app/package.json
      - /home/berestov/projects/ai-collection-server/app/package-lock.json:/usr/src/app/package-lock.json
      - /home/berestov/projects/ai-collection-server/app/tsconfig.json:/usr/src/app/tsconfig.json
      - /home/berestov/projects/ai-collection-server/app/nodemon.json:/usr/src/app/nodemon.json
      - /home/berestov/projects/ai-collection-server/.env.nodejs:/usr/src/app/.env.nodejs
      - /home/berestov/projects/ai-collection-server/app/src/tests:/usr/src/app/tests/e2e
    networks:
      - proxy
    restart: unless-stopped
    # Пик за три месяца работы — 388 МБ; лимит 1 ГБ ловит утечку раньше, чем её
    # заметит OOM-киллер на хосте, и не мешает штатной работе. Вес — как у camofox.
    mem_limit: 1g
    cpu_shares: 1024
  landing:
    build:
      context: ../landing
      dockerfile: Dockerfile
    container_name: landing
    restart: unless-stopped
    networks:
      - proxy
  main:
    build:
      context: ../main
      dockerfile: Dockerfile
    container_name: main
    restart: unless-stopped
    networks:
      - proxy
  error-pages:
    build:
      context: ../error-pages
      dockerfile: Dockerfile
    container_name: error-pages
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true